name: Agent dynamic market edge validation

on:
  push:
    branches:
      - agent/dynamic-market-edge-zoo

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,models]'
      - name: Dynamic market-edge tests
        run: pytest -q tests/analytics/test_dynamic_market_edge_zoo.py
      - name: Market-edge tests
        run: pytest -q tests/analytics/test_market_edge_model_zoo.py
      - name: Full test suite
        run: pytest -q
