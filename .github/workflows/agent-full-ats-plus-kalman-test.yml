name: Agent FULL ATS plus Kalman validation

on:
  push:
    branches:
      - agent/full-ats-plus-kalman-challenger

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,models]'
      - name: FULL ATS plus Kalman tests
        run: pytest -q tests/analytics/test_full_ats_plus_kalman_challenger.py
      - name: Kalman deep-audit tests
        run: pytest -q tests/analytics/test_kalman_ats_deep_audit.py
      - name: Full test suite
        run: pytest -q
