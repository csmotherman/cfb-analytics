name: Temporary market-aware fan validation

on:
  push:
    branches:
      - agent/website-fan-experience-v3

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python project
        run: pip install -e '.[dev]'
      - name: Run market scheduler tests
        run: pytest tests/analytics/test_publish_beat_the_model_schedule.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install website
        working-directory: website
        run: npm install
      - name: Typecheck website
        working-directory: website
        run: npm run typecheck
      - name: Build website
        working-directory: website
        run: npm run build
