name: Agent Kalman ATS deep audit validation

on:
  push:
    branches:
      - agent/kalman-market-edge-deep-audit

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,models]'
      - name: Kalman ATS deep-audit tests
        run: pytest -q tests/analytics/test_kalman_ats_deep_audit.py
      - name: Dynamic model tests
        run: pytest -q tests/analytics/test_dynamic_market_edge_zoo.py
      - name: Full test suite
        run: pytest -q
