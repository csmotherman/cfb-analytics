name: Agent market benchmark validation

on:
  push:
    branches:
      - agent/market-spread-benchmark

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,models]'
      - name: Market benchmark tests
        run: pytest -q tests/analytics/test_prediction_v2_market_benchmark.py
      - name: Full test suite
        run: pytest -q
