name: Export FBS team metadata once

on:
  push:
    branches:
      - agent/website-fan-experience-v3
    paths:
      - .github/workflows/export-team-metadata-once.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/website-fan-experience-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e .
      - name: Fetch official FBS team metadata
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from cfb_analytics.sources.cfbd.client import CfbdClient
          from cfb_analytics.analytics.publish_beat_the_model_schedule_v4 import team_metadata_from_payload

          with CfbdClient() as client:
              raw = client.teams().payload
          metadata = team_metadata_from_payload(raw)
          rows = [
              {"team": team, **fields}
              for team, fields in sorted(metadata.items())
          ]
          payload = {
              "schemaVersion": 1,
              "source": "cfbd-/teams",
              "classification": "fbs",
              "teamCount": len(rows),
              "teams": rows,
          }
          out = Path("website/data/beat-the-model/team-metadata.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          assert len(rows) >= 130, f"unexpected FBS team count: {len(rows)}"
          assert sum(bool(row.get("logo")) for row in rows) >= 120, "logo coverage unexpectedly low"
          print(f"TEAM METADATA PASS teams={len(rows)} logos={sum(bool(row.get('logo')) for row in rows)}")
          PY
      - name: Commit metadata
        run: |
          git add website/data/beat-the-model/team-metadata.json
          if git diff --cached --quiet; then
            echo "No metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: add FBS team logos and metadata"
          git push origin HEAD:agent/website-fan-experience-v3
