name: Agent ATS prospective freeze validation

on:
  push:
    branches:
      - agent/ats-logistic-prospective-freeze

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,models]'
      - name: ATS freeze tests
        run: pytest -q tests/analytics/test_ats_logistic_prospective_freeze.py
      - name: Deep audit tests
        run: pytest -q tests/analytics/test_ats_logistic_deep_audit.py
      - name: Full test suite
        run: pytest -q
