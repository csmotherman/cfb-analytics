name: Agent dynamic Bayesian offense-defense validation

on:
  push:
    branches:
      - agent/dynamic-bayesian-offense-defense

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,models]'
      - name: Dynamic Bayesian O-D tests
        run: pytest -q tests/analytics/test_dynamic_bayesian_offense_defense.py
      - name: FULL ATS plus Kalman regression tests
        run: pytest -q tests/analytics/test_full_ats_plus_kalman_challenger.py
      - name: Full test suite
        run: pytest -q
