name: Temporary archive early-prior validation

on:
  push:
    branches:
      - agent/website-predictions-clean

jobs:
  archive-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: pytest -q tests/analytics/test_historical_prediction_v2_archive.py tests/analytics/test_website_prediction_archive.py tests/analytics/test_publish_website_archive.py
