name: Agent v2 notebook challenger validation

on:
  push:
    branches:
      - agent/v2-notebook-feature-challenger

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,models]'
      - name: Challenger tests
        run: pytest -q tests/analytics/test_prediction_v2_notebook_feature_challenger.py
      - name: Notebook fidelity tests
        run: pytest -q tests/analytics/test_notebook_srs_elasticnet.py
      - name: Full test suite
        run: pytest -q
