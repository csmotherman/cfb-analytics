name: Agent adjusted scoring validation

on:
  push:
    branches:
      - agent/adjusted-scoring-challenger

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,models]'
      - name: Adjusted scoring tests
        run: |
          pytest -q tests/analytics/test_prediction_v2_adjusted_scoring_challenger.py
          pytest -q tests/analytics/test_adjusted_scoring_model.py
      - name: Full test suite
        run: pytest -q
