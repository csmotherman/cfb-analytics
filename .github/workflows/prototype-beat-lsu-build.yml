name: Build Beat 2019 LSU prototype data

# One-time data build/validation workflow for the standalone prototype branch.
on:
  push:
    branches:
      - agent/beat-2019-lsu-prototype
    paths:
      - .github/workflows/prototype-beat-lsu-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beat-2019-lsu-prototype
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e '.[dev]'

      - name: Run prototype tests
        run: pytest -q tests/prototypes/test_historical_unit_draft.py

      - name: Build real historical challenge dataset
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m cfb_analytics.prototypes.historical_unit_draft \
            --build \
            --data data/prototypes/beat-2019-lsu/challenge-v1.json \
            --difficulty-sims 3000 \
            --wheel-top-n 35

      - name: Validate generated contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/prototypes/beat-2019-lsu/challenge-v1.json')
          d = json.loads(p.read_text())
          assert d['challengeVersion'] == 'historical-unit-draft-v1'
          assert d['status'] == 'data-prototype-only'
          assert d['target']['season'] == 2019
          assert d['target']['team'] == 'LSU'
          assert len(d['rules']['categories']) == 7
          assert len(d['wheelPool']) >= 250
          assert all(len(r['categories']) == 7 for r in d['wheelPool'])
          assert d['marginCalibration']['games'] >= 500
          assert d['strengthModel']['trainingTeamSeasons'] >= 500
          bench = d['difficultyBenchmark']
          assert 0 <= bench['greedyVisibleGradeStrategy']['winRate'] <= 1
          assert 0 <= bench['perfectForesightUpperBound']['winRate'] <= 1
          print('BEAT 2019 LSU DATA CONTRACT: PASS')
          print('wheel', len(d['wheelPool']))
          print('targetSrs', d['target']['srs'])
          print('strengthR2', d['strengthModel']['r2'])
          print('marginGames', d['marginCalibration']['games'])
          print('greedyWinRate', bench['greedyVisibleGradeStrategy']['winRate'])
          print('oracleWinRate', bench['perfectForesightUpperBound']['winRate'])
          print('sourceStatus', d['sourceStatus'])
          PY

      - name: Run deterministic demo
        run: |
          python -m cfb_analytics.prototypes.historical_unit_draft \
            --demo \
            --data data/prototypes/beat-2019-lsu/challenge-v1.json \
            --seed 42

      - name: Commit prototype data
        run: |
          git add data/prototypes/beat-2019-lsu/challenge-v1.json
          if git diff --cached --quiet; then
            echo 'No prototype data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: add Beat 2019 LSU prototype dataset'
          git push origin HEAD:agent/beat-2019-lsu-prototype
