name: Temporary fan UI validation

on:
  push:
    branches:
      - agent/website-predictions-clean

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e . pytest
      - run: pytest -q tests/analytics/test_beat_the_model.py tests/analytics/test_publish_beat_the_model_schedule.py tests/analytics/test_website_prediction_archive.py tests/analytics/test_publish_website_archive.py
      - working-directory: website
        run: npm install
      - working-directory: website
        run: npm run typecheck
      - working-directory: website
        run: npm run build
